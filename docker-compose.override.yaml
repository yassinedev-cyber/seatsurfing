services:
  node:
    environment:
      CRYPT_KEY: "local-dev-only-crypt-key-32bytes"
      PUBLIC_SCHEME: "http"
      PUBLIC_PORT: "8080"
      # Platform operator bootstrap (first org = CODYN, its admin = super admin)
      INIT_ORG_NAME: "CODYN Workspace"
      INIT_ORG_USER: "admin"
      INIT_ORG_PASS: "Sea!surf1ng"
      INIT_ORG_DOMAIN: "localhost"
      INIT_ORG_LANGUAGE: "en"
      # Feature flags. ALLOW_ORG_DELETE lets org admins delete their own
      # organization (two-step, e-mail confirmed); the platform operator may
      # delete a client workspace regardless of this flag.
      FEATURE_FLAGS: "ALLOW_ORG_DELETE"
