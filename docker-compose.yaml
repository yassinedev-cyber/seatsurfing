services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      sql:
    ports:
      - 8080:8080
    environment:
      POSTGRES_URL: "postgres://seatsurfing:DB_PASSWORD@db/seatsurfing?sslmode=disable"
  db:
    image: postgres:18
    restart: always
    networks:
      sql:
    volumes:
      # Postgres 18 keeps its data in a versioned subdirectory and expects the
      # mount one level up. Mounting /var/lib/postgresql/data, as was right for
      # 17, leaves the volume unused and the container refuses to start.
      - db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: DB_PASSWORD
      POSTGRES_USER: seatsurfing
      POSTGRES_DB: seatsurfing

volumes:
  db:

networks:
  sql:
